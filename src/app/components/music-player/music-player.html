<div class="player" [class.playing]="music.playing()">
  @if (bubble()) {
    <button type="button" class="bubble" animate.enter="bubble-in" animate.leave="bubble-out" (click)="bubble.set(false)">
      <app-doodle name="note" /> {{ music.song.note }}
    </button>
  }

  <button type="button" class="vinyl" (click)="bubble.set(!bubble())" aria-label="About our song">
    <span class="record"><span class="label"><app-doodle name="heart" [filled]="true" /></span></span>
  </button>

  <div class="meta">
    <span class="title">{{ music.song.title }}</span>
    <span class="artist">{{ music.failed() ? 'add your mp3 to /public/music' : music.song.artist }}</span>
  </div>

  <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>

  <button type="button" class="pp" (click)="music.toggle()" [attr.aria-label]="music.playing() ? 'Pause song' : 'Play song'">
    @if (music.playing()) {
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2" /><rect x="13.9" y="5" width="3.6" height="14" rx="1.2" /></svg>
    } @else {
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.2-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" /></svg>
    }
  </button>
</div>
