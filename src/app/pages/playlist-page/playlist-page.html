<article class="page">
  <header class="page-head">
    <span class="kicker">{{ chapter }}</span>
    <h2 class="script-title">{{ p.title }}</h2>
    <p class="lead">{{ p.intro }}</p>
  </header>

  <section class="turntable" [class.playing]="music.pagePlaying()">
    <div class="deck">
      <div class="disc">
        <div class="disc-label">
          <app-doodle name="heart" [filled]="true" />
        </div>
      </div>
      <div class="arm" aria-hidden="true"><span class="arm-head"></span></div>
    </div>

    <h3 class="song-title">{{ music.pageSong.words }}</h3>

    <div class="controls">
      <span class="t">{{ time(music.pageTime()) }}</span>
      <button type="button" class="bar" (click)="seek($event)" aria-label="Seek">
        <span class="fill" [style.width.%]="progress()"></span>
      </button>
      <span class="t">{{ time(music.pageDuration()) }}</span>
    </div>
    <button type="button" class="big-pp" (click)="music.togglePageSong()">
      {{ music.pagePlaying() ? 'pause' : 'play' }}
    </button>
  </section>

  <section class="lyrics">
    <span class="tape"></span>
    @for (line of p.lyrics; track $index) {
      <p class="lyric" dir="auto">{{ line }}</p>
    }
    <app-secret class="lyrics-secret" at="playlist" doodle="note" [filled]="false" />
  </section>
</article>
